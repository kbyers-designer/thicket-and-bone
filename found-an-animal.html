<style>
:root{
  --bg:#f5f1e8;
  --card:#fffdf9;
  --ink:#1f2b27;
  --muted:#5b6862;
  --line:#ddd6c6;
  --teal:#5ba592;
  --teal-dark:#2b6b59;
  --green:#006e48;
  --green-dark:#005838;
  --blue:#6ea1d3;
  --blue-tint:#e8f0f8;
  --urgent:#9b2f2f;
  --urgent-tint:#f8ebe9;
  --caution:#8a5a12;
  --caution-tint:#f8f0df;
  --calm:#2b6b59;
  --calm-tint:#e8f2ee;
  --radius:14px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:1.0625rem;line-height:1.55;
}
.wrap{max-width:660px;margin:0 auto;padding:0 16px 40px}
header.site{background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;text-align:center;margin-bottom:18px}
header.site img{width:min(100%,520px);height:auto;display:inline-block;vertical-align:middle}
a{color:var(--teal-dark)}
a:hover{color:var(--green-dark)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
h1{font-size:1.85rem;margin-bottom:.5rem}
h1:focus{outline:none}
h2{font-size:1.3rem}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;box-shadow:0 1px 2px rgba(31,43,39,.05),0 8px 24px rgba(31,43,39,.05);
  margin-bottom:16px;
}
.eyebrow{
  font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-dark);
  font-weight:700;margin:0 0 .4rem;
}
.sub{color:var(--muted);margin:.25rem 0 1rem}
.lead{font-size:1.12rem;margin:.4rem 0 1rem}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 10px}
.linkbtn{
  background:none;border:0;padding:8px 4px;font:inherit;font-size:.95rem;color:var(--teal-dark);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--green);color:#fff;border:0;border-radius:12px;
  padding:14px 22px;min-height:52px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;
  text-decoration:none;
}
.btn:hover{background:var(--green-dark);color:#fff}
.btn.secondary{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn.secondary:hover{background:var(--calm-tint);color:var(--green-dark)}
.btn.block{display:flex;width:100%}
.fine{font-size:.9rem;color:var(--muted);margin:.9rem 0 0}
.options{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#fff;border:1.5px solid var(--line);border-radius:12px;
  padding:14px 16px;min-height:60px;font:inherit;color:inherit;cursor:pointer;
}
.opt:hover{border-color:var(--teal);background:#f7fbf9}
.opt .t{flex:1}
.opt strong{display:block;font-size:1.04rem;line-height:1.3}
.opt .d{display:block;color:var(--muted);font-size:.93rem;margin-top:2px}
.opt::after{content:"\203A";font-size:1.6rem;color:var(--teal);line-height:1}
.aside{
  background:var(--blue-tint);border-radius:12px;padding:14px 16px;margin-top:16px;font-size:.98rem;
}
.aside strong{font-family:var(--serif);font-size:1.05rem}

/* results */
.result{border-left-width:7px}
.result.tone-urgent{border-left-color:var(--urgent)}
.result.tone-caution{border-left-color:var(--caution)}
.result.tone-calm{border-left-color:var(--calm)}
.chip{
  display:inline-block;font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;margin-bottom:10px;
}
.tone-urgent .chip{background:var(--urgent-tint);color:var(--urgent)}
.tone-caution .chip{background:var(--caution-tint);color:var(--caution)}
.tone-calm .chip{background:var(--calm-tint);color:var(--calm)}
ol.steps{list-style:none;counter-reset:s;margin:1rem 0 .5rem;padding:0;display:grid;gap:12px}
ol.steps li{counter-increment:s;position:relative;padding-left:46px;min-height:34px}
ol.steps li::before{
  content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;
  background:var(--teal-dark);color:#fff;font-weight:800;display:grid;place-items:center;font-size:1rem;
}
ol.steps li b{font-weight:700}
details{
  border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:12px;
}
summary{
  cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;
  justify-content:space-between;align-items:center;gap:10px;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--teal-dark)}
details[open] summary::after{content:"\2212"}
details .body{padding:0 16px 14px}
ul.plain{margin:0;padding-left:1.2rem;display:grid;gap:6px}
ul.dont{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.dont li{position:relative;padding-left:28px}
ul.dont li::before{content:"\2715";position:absolute;left:0;top:0;color:var(--urgent);font-weight:800}
.tagline{font-family:var(--serif);font-style:italic;color:var(--urgent);font-size:1.15rem;margin:.8rem 0 0}
.switch{
  background:var(--urgent-tint);border-radius:12px;padding:14px 16px;margin:12px 0 4px;
}
.switch p{margin:0 0 10px;font-weight:600}
.callout{
  background:var(--calm-tint);border-radius:12px;padding:14px 16px;margin-top:14px;
}
.callout p{margin:0}
.res{display:grid;gap:10px;margin-top:12px}
.res a{
  display:block;text-decoration:none;color:inherit;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:12px 16px;
}
.res a:hover{border-color:var(--teal);background:#f7fbf9}
.res a strong{display:block;color:var(--teal-dark)}
.res a span{display:block;color:var(--muted);font-size:.93rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
footer.site{text-align:center;padding:10px 0 0;color:var(--muted);font-size:.9rem}
footer.site img{width:min(70%,300px);height:auto;margin-bottom:8px}
footer.site p{margin:.5rem auto;max-width:520px}
.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:999px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (min-width:560px){
  h1{font-size:2.15rem}
  .card{padding:26px 26px}
}
</style>
</head>

        <p>This guide needs JavaScript to run. The short version: watch from a distance for 2 to 3 minutes. If the animal is hurt, place it in a lined, ventilated box with minimal handling, keep it dark and quiet, do not feed it, and call a licensed wildlife rehabilitator. Send a photo by text. Find one at <a href="https://ahnow.org">ahnow.org</a>.</p>

  function viewQuestion(id) {
    var q = QUESTIONS[id];
    var opts = q.options.map(function (o) {
      return '<button type="button" class="opt" data-go="' + o.to + '"><span class="t"><strong>' + o.t + '</strong>' +
        (o.d ? '<span class="d">' + o.d + '</span>' : '') + '</span></button>';
    }).join("");
    return {
      title: q.title + " | Thicket & Bone",
      node: el(
        '<section class="card">' + topbar(true) +
          '<h1 id="view-title" tabindex="-1">' + q.title + '</h1>' +
          '<p class="sub">' + q.sub + '</p>' +
          '<div class="options">' + opts + '</div>' +
        '</section>')
    };
  }

  function sectionHtml(s) {
    var body = "";
    if (s.kind === "dont") {
      body = '<ul class="dont">' + s.items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>" +
        (s.tagline ? '<p class="tagline">' + s.tagline + "</p>" : "");
    } else if (s.kind === "list") {
      body = '<ul class="plain">' + s.items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>" +
        (s.note ? '<p style="margin:12px 0 0"><b>' + s.note + "</b></p>" : "");
    } else {
      body = "<p style=\"margin:0\">" + s.text + "</p>";
    }
    return '<details' + (s.open ? " open" : "") + '><summary>' + s.title + '</summary><div class="body">' + body + "</div></details>";
  }

  function viewResult(id) {
    var r = RESULTS[id];
    var html = '<section class="card result tone-' + r.tone + '">' + topbar(true) +
      '<span class="chip">' + r.chip + '</span>' +
      '<h1 id="view-title" tabindex="-1">' + r.title + '</h1>' +
      '<p class="lead">' + r.lead + '</p>';
    if (r.switchTo) {
      html += '<div class="switch"><p>' + r.switchTo.text + '</p><button type="button" class="btn secondary" data-go="' + r.switchTo.to + '">' + r.switchTo.label + '</button></div>';
    }
    html += '<ol class="steps">' + r.steps.map(function (s) { return "<li>" + s + "</li>"; }).join("") + "</ol>";
    if (r.after) { html += '<p style="margin:.8rem 0 0;font-weight:600">' + r.after + "</p>"; }
    (r.sections || []).forEach(function (s) { html += sectionHtml(s); });
    html += "</section>";

    if (r.resources) {
      html += '<section class="card"><h2>Find a licensed rehabilitator</h2>' +
        '<div class="callout"><p>' + TEXAS_NOTE + '</p></div>' +
        '<div class="res">' + RESOURCES.map(function (x) {
          return '<a href="' + x.url + '" target="_blank" rel="noopener"><strong>' + x.name + '</strong><span>' + x.desc + '</span></a>';
        }).join("") + '</div>' +
        '<div class="actions"><button type="button" class="btn secondary" data-share>Share this guide</button>' +
        '<a class="btn secondary" href="#/start">Start over</a></div>' +
        (CONFIG.substackUrl ? '<div class="aside"><strong>Read more from Thicket and Bone</strong><br>Investigative reporting on wildlife and conservation on the Texas Gulf Coast. <a href="' + CONFIG.substackUrl + '" target="_blank" rel="noopener">Subscribe on Substack</a>.</div>' : '') +
        '</section>';
    }

    var wrap = document.createElement("div");
    wrap.innerHTML = html;
    return { title: r.title + " | Thicket & Bone", node: wrap };
  }

  function render(id) {
    var v;
    if (id === "start" || (!QUESTIONS[id] && !RESULTS[id])) { id = "start"; v = viewStart(); }
    else if (QUESTIONS[id]) { v = viewQuestion(id); }
    else { v = viewResult(id); }
    current = id;
    app.innerHTML = "";
    app.appendChild(v.node);
    document.title = v.title;
    window.scrollTo(0, 0);
    var h = document.getElementById("view-title");
    if (h) { h.focus({ preventScroll: true }); }
  }

  function currentId() {
    var h = (location.hash || "").replace(/^#\/?/, "");
    return h || "start";
  }

  function go(id) {
    trail.push(current);
    location.hash = "#/" + id;
  }

  window.addEventListener("hashchange", function () { render(currentId()); });

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go],[data-back],[data-share]");
    if (!t) { return; }
    if (t.hasAttribute("data-go")) { go(t.getAttribute("data-go")); }
    else if (t.hasAttribute("data-back")) {
      var prev = trail.pop();
      location.hash = "#/" + (prev || "start");
    } else if (t.hasAttribute("data-share")) { share(); }
  });

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show";
    setTimeout(function () { t.className = "toast"; }, 2200);
  }

  function share() {
    var url = location.href.split("#")[0];
    var data = { title: "Found an animal? What to do next", text: "A quick guide for finding help for injured or orphaned wildlife.", url: url };
    if (navigator.share) { navigator.share(data).catch(function () {}); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { toast("Link copied"); }, function () { toast(url); });
    } else { toast(url); }
  }

  /* ---------- Setup ---------- */
  document.getElementById("updated").textContent = "Updated " + CONFIG.updated + ".";
  if (CONFIG.homeUrl) {
    var hl = document.getElementById("homelink");
    hl.setAttribute("href", CONFIG.homeUrl);
  }
  render(currentId());
})();
</script>
</body>
</html>
